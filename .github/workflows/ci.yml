name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Frontend logic
        run: |
          for test in tests/test_*.cjs; do
            node "$test"
          done
      - name: Validate translations and generated asset hashes
        run: |
          python scripts/build_locales.py
          git diff --exit-code -- static/locales.js static/index.html
      - name: Build and audit both installation editions
        run: |
          python scripts/build_release.py
          python scripts/verify_release.py dist
      - name: Check deterministic release archives
        run: |
          cp dist/SHA256SUMS "$RUNNER_TEMP/expected-checksums"
          python scripts/build_release.py
          diff -u "$RUNNER_TEMP/expected-checksums" dist/SHA256SUMS

  browser:
    name: Synthetic browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Render real UI using fictional hardware and users
        run: python scripts/render_readme.py --output-dir test-results/synthetic
      - name: Save synthetic screenshots for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-ui-preview
          path: test-results/synthetic/*.png
          retention-days: 7
          if-no-files-found: error
